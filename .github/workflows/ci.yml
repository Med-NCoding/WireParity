name: WireParity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, Build & Multi-Language Differential Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Node dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build TypeScript
        run: pnpm run build

      - name: Run Differential Test Suite
        run: pnpm test

      - name: Verify CLI Binary Execution
        run: |
          node ./dist/cli/bin.js --help
          node ./dist/cli/bin.js --version

